        <h1 class="title" style="text-align: center; margin-top: 30px;">Регистрация</h1>
        <section class="forme">
        <form class="forma" action="#" method="post">
                <li class="li_forma">
                    <label for="login">Логин:</label>
                    <input style="width: 200px; height: 30px;" type="text" name="login" id="login" placeholder="" required>
                </li>

                <li class="li_forma">
                    <label for="password">Пароль:</label>
                    <input style="width: 200px; height: 30px;" type="password" name="password" id="password" placeholder="" required>
                </li>      

                <li class="li_forma">
                    <label for="email">E-mail:</label>
                    <input style="width: 200px; height: 30px;" type="email" name="email" id="email" placeholder="" required>
                </li>

                <li class="li_forma">
                    <label for="age">Возраст:</label>
                    <input style="width: 100px; height: 30px;" type="number" name="age" id="age" placeholder="" min="16" max="100" required>
                </li>
                
                <li class="li_forma">
                    <label for="fullname">ФИО:</label>
                    <input style="width: 200px; height: 30px;" type="text" name="fullname" id="fullname" placeholder="" required>
                </li>

                <li class="li_forma">
                    <label for="phone">Номер телефона:</label>
                    <input style="width: 200px; height: 30px;" type="tel" name="phone" id="phone" placeholder="" required>
                </li>
        </form>
        <button class="reg">Зарегистрироваться</button>
